[project]
name = "veildrop"
version = "0.1.0"
description = "Post-Quantum-Ready Zero-Knowledge Anonymous Reporting & Secure Evidence Exchange Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.52.1",
    "asyncpg==0.31.0",
    "cryptography==50.0.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "argon2-cffi==25.1.0",
    "webauthn==3.0.0",
    "aiofiles==25.1.0",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "mypy==2.3.0",
    "bandit==1.9.4",
    "ruff==0.16.2",
    "pip-audit==2.9.4",
    "types-aiofiles==24.1.0",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "stubs"
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", "stubs"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Assertions and broad exception assertions are the point of tests.
"tests/*" = ["S101", "B017", "S107", "S105"]
