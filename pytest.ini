[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = backend/tests
markers =
    perf: timing/benchmark tests with intentionally loose thresholds; run via -m perf
    replication: end-to-end WAL streaming tests against a primary+standby pair (VEILDROP_REPL_PRIMARY_URL / VEILDROP_REPL_STANDBY_URL); run via -m replication
